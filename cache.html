<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>H4SENSI // OFFLINE CACHE</title>
<style>
:root{color-scheme:dark;--bg:#030608;--line:#17303b;--text:#e8fff1;--muted:#71828c;--green:#5cff9a;--amber:#ffd166;--red:#ff6675}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Courier New",monospace}
main{width:min(760px,92vw);margin:8vh auto}.box{border:1px solid var(--line);padding:24px;background:#071015}.tag{color:var(--muted);font-size:11px;letter-spacing:.14em}.title{font-size:42px;margin:12px 0}.bar{height:14px;border:1px solid var(--line);background:#030608;margin-top:24px;overflow:hidden}.fill{height:100%;width:0;background:var(--green);transition:width .15s}.status{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.6}.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
</style>
</head>
<body>
<main><section class="box">
<div class="tag">H4SENSI // LOCAL CACHE INSTALLER</div>
<div class="title">OFFLINE CACHE</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="status" id="status">Registering service worker...</div>
</section></main>
<script>
(function(){
"use strict";
var fill=document.getElementById("fill"),status=document.getElementById("status"),sent=false;
function send(controller){
  if(sent||!controller)return;
  sent=true;
  status.textContent="Caching every local host asset...";
  controller.postMessage({type:"CACHE_URLS",urls:["./","./index.html","./cache.html","./sw.js","./700/alert.js","./700/config.js","./700/kpatch/700.elf","./700/kpatch/750.elf","./700/kpatch/800.elf","./700/kpatch/850.elf","./700/lapse.js","./700/lapse/700.js","./700/lapse/750.js","./700/lapse/751.js","./700/lapse/800.js","./700/lapse/850.js","./700/lapse/852.js","./700/module/chain.js","./700/module/int64.js","./700/module/mem.js","./700/module/memtools.js","./700/module/offset.js","./700/module/rw.js","./700/module/utils.js","./700/module/view.js","./700/psfree.js","./700/rop/700.js","./700/rop/750.js","./700/rop/800.js","./700/rop/850.js","./700/send.js","./900/alert.js","./900/config.js","./900/lapse.js","./900/lapse/900.js","./900/lapse/903.js","./900/lapse/950.js","./900/module/chain.js","./900/module/constants.js","./900/module/int64.js","./900/module/mem.js","./900/module/memtools.js","./900/module/offset.js","./900/module/rw.js","./900/module/utils.js","./900/module/view.js","./900/psfree.js","./900/rop/900.js","./900/rop/950.js","./900/send.js","./cache.manifest","./core.js","./css/lapse.js","./css/loader.js","./css/main.js","./css/misc.js","./css/ps4/constants.js","./css/ps4/kernel.js","./css/ps4/patches/1000.bin","./css/ps4/userland.js","./css/worker.js","./css/workers.js","./goldhen.bin","./goldhen_2.4b18.12.bin","./int64.js","./jb.html","./jb.js","./mem.js","./patches/1302.bin","./patches/1350.bin","./patches/1352.bin","./ps4_offsets.js","./rpc_worker.js"]});
}
if(!("serviceWorker" in navigator)){
  status.className="bad";
  status.textContent="Service Worker is not available in this browser.";
  return;
}
navigator.serviceWorker.addEventListener("message",function(e){
  var d=e.data||{};
  if(d.type==="PRECACHE_PROGRESS"){
    var pct=d.total?Math.round(d.done/d.total*100):0;
    fill.style.width=pct+"%";
    status.textContent="Cached "+d.ok+"/"+d.total+" files // "+pct+"%";
  }else if(d.type==="PRECACHE_DONE"){
    fill.style.width="100%";
    if(d.failed){
      status.className="warn";
      status.textContent="Cache installed with "+d.failed+" missing asset(s). Online fallback remains available.";
    }else{
      status.className="ok";
      status.textContent="Cache verified. Launching host...";
      setTimeout(function(){location.href="./index.html";},500);
    }
  }
});
navigator.serviceWorker.addEventListener("controllerchange",function(){
  send(navigator.serviceWorker.controller);
});
navigator.serviceWorker.register("./sw.js",{scope:"./"}).then(function(reg){
  return navigator.serviceWorker.ready.then(function(){
    send(navigator.serviceWorker.controller||reg.active);
  });
}).catch(function(){
  status.className="bad";
  status.textContent="Service Worker registration failed.";
});
})();
</script>
</body>
</html>
