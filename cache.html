<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover">
<title>H4SENSI | Offline Cache</title>
<style>
:root{color-scheme:dark;--bg:#151515;--panel:#1c1c1c;--line:#2e2e2e;--text:#f5f5f5;--muted:#b5b5b5;--dim:#828282;--accent:#a294ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column;font:17px/1.4 Consolas,"Liberation Mono",monospace;min-height:100vh}
.app{display:flex;flex:1 0 auto;flex-direction:column;margin:0 auto;padding:14px 26px 12px;width:min(100% - 52px,920px)}
.bar{align-items:center;border:1px solid #454545;display:flex;font-size:14px;justify-content:space-between;letter-spacing:.1em;padding:10px 16px;text-transform:uppercase}
.bar b{color:var(--accent);font-weight:400}.layout{display:flex;flex:1 0 auto;flex-direction:column;justify-content:center;padding:20px 0 0}
.kicker{color:var(--accent);font-size:14px;letter-spacing:.14em;margin:0 0 12px}h1{font-size:clamp(32px,5vw,52px);font-weight:400;letter-spacing:-.07em;line-height:1;margin:0}
h1 em{color:var(--accent);font-style:normal}.boot{color:var(--dim);font-size:14px;list-style:none;margin:12px 0 0}.boot li{margin:3px 0}
.boot b{color:var(--accent);font-weight:400}.progress-container{margin-top:20px;width:100%}.progress-label{color:var(--accent);font-size:15px;margin-bottom:10px}
.progress-wrapper{background:var(--panel);border:1px solid #454545;padding:6px}.progress-bar{background:#242424;border:1px solid var(--line);height:62px;overflow:hidden;position:relative}
.progress-fill{background:var(--accent);height:100%;width:0}.progress-text{color:var(--text);font-size:20px;left:50%;position:absolute;top:50%;transform:translate(-50%,-50%);z-index:3}
.status-message{color:var(--muted);font-size:15px;margin-top:12px}.foot{border-top:1px solid var(--line);color:var(--dim);font-size:13px;margin-top:16px;padding:12px 4px 2px;text-align:center}
@media(max-width:700px){.app{padding:8px 10px;width:min(100% - 20px,560px)}.bar{font-size:12px;padding:8px 12px}.layout{padding-top:14px}h1{font-size:40px}.progress-bar{height:56px}}
</style>
</head>
<body>
<div class="app">
<header class="bar"><span><b>H4SENSI</b> // ps4 hosts</span><span id="state">CACHE SETUP</span></header>
<main class="layout">
<p class="kicker">$ ./cache --install</p>
<h1>Loading <em>offline cache</em></h1>
<ul class="boot">
<li>[ <b id="sw">..</b> ] service worker</li>
<li>[ <b id="shell">..</b> ] offline shell</li>
</ul>
<section class="progress-container">
<div class="progress-label" id="progress">Preparing cache</div>
<div class="progress-wrapper"><div class="progress-bar"><div class="progress-fill" id="myBar"></div><div class="progress-text" id="progressText">0%</div></div></div>
<div class="status-message" id="status">Installing local cache...</div>
</section>
</main>
<footer class="foot">H4SENSI // OFFLINE CACHE</footer>
</div>
<script>
(function(){
"use strict";
var state=document.getElementById("state"),sw=document.getElementById("sw"),shell=document.getElementById("shell"),progress=document.getElementById("progress"),status=document.getElementById("status"),bar=document.getElementById("myBar"),pct=document.getElementById("progressText");

function finish(message){
  progress.textContent=message;
  status.textContent="Returning to host...";
  bar.style.width="100%";
  pct.textContent="100%";
  setTimeout(function(){location.replace("./index.html");},700);
}

if(!("serviceWorker" in navigator)){
  sw.textContent="no";
  state.textContent="CACHE UNSUPPORTED";
  status.textContent="This browser does not expose Service Worker support.";
  return;
}

navigator.serviceWorker.register("./sw.js",{scope:"./"}).then(function(reg){
  sw.textContent="ok";
  state.textContent="CACHE ONLINE";
  bar.style.width="45%";
  pct.textContent="45%";
  status.textContent="Service Worker installed.";

  var ready=function(){
    shell.textContent="ok";
    bar.style.width="100%";
    pct.textContent="100%";
    state.textContent="CACHE READY";
    finish("Offline cache ready");
  };

  if(reg.active)ready();
  else if(reg.installing){
    reg.installing.addEventListener("statechange",function(){
      if(this.state==="activated")ready();
    });
  } else {
    ready();
  }
}).catch(function(err){
  sw.textContent="fail";
  shell.textContent="--";
  state.textContent="CACHE ERROR";
  status.textContent="Install failed: "+String(err).slice(0,100);
});
})();
</script>
</body>
</html>
