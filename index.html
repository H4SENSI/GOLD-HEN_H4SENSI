<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>H4SENSI // GOLDHEN MULTI</title>
<style>
:root{color-scheme:dark;--bg:#030608;--panel:#081017;--line:#17303b;--text:#e8fff1;--muted:#71828c;--dim:#3b4b54;--green:#5cff9a;--amber:#ffd166;--red:#ff6675}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Courier New",monospace}
body{background-image:linear-gradient(rgba(92,255,154,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(92,255,154,.03) 1px,transparent 1px);background-size:28px 28px}
main{width:min(940px,94vw);margin:auto;padding:24px 0}.bar{display:flex;justify-content:space-between;border:1px solid var(--line);padding:12px 14px}.brand{font-weight:800;letter-spacing:.23em}
h1{font-size:clamp(34px,8vw,70px);line-height:.9;font-weight:400;letter-spacing:-.07em;margin:34px 0 8px}
.panel{margin-top:22px;border:1px solid var(--line);background:#060c10}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}.cell{padding:14px;background:#071015}.label{display:block;color:var(--dim);font-size:10px;letter-spacing:.13em;margin-bottom:6px}.v{font-size:13px;font-weight:700}.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
.term{min-height:165px;padding:15px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:#8ca198;font-size:12px;line-height:1.55;white-space:pre-wrap;overflow:auto}
.controls{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:15px}select,.btn{border:1px solid var(--line);background:#0a1218;color:var(--text);padding:13px 12px;font:700 12px "Courier New",monospace}.btn{cursor:pointer}.btn.primary{background:var(--green);color:#001108;border-color:var(--green)}.btn:disabled{opacity:.4;cursor:default}
@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header class="bar"><span class="brand">H4SENSI</span></header>
<h1>GOLDHEN_MULTI</h1>
<section class="panel">
<div class="grid">
<div class="cell"><span class="label">FIRMWARE</span><span class="v" id="fw">SCANNING</span></div>
<div class="cell"><span class="label">ENGINE</span><span class="v" id="engine">SCANNING</span></div>
<div class="cell"><span class="label">PRECHECK</span><span class="v" id="pre">WAITING</span></div>
</div>
<div class="term" id="term" role="log" aria-live="polite">$ H4SENSI
[BOOT] terminal online
[BOOT] reading PlayStation browser user-agent...</div>
<div class="controls">
<button class="btn" id="scan">RESCAN</button>
<button class="btn primary" id="launch" disabled>INITIALIZE</button>
</div>
</section>
</main>
<script>
(function(){
"use strict";

if("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message",function(event){
    var d=event.data||{};
    if(d.type==="PRECACHE_PROGRESS"){
      terminalWrite("cache "+d.done+"/"+d.total+" ok="+d.ok,"CACHE");
    }else if(d.type==="PRECACHE_DONE"){
      terminalWrite("cache complete ok="+d.ok+" failed="+d.failed,"CACHE");
    }
  });
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js?v=3",{scope:"./"})
    .then(function(reg){
      if(reg.waiting){reg.waiting.postMessage({type:"SKIP_WAITING"});}
    })
    .catch(function(){});
}

var F700={"7.00":1,"7.01":1,"7.02":1,"7.50":1,"7.51":1,"7.55":1,"8.00":1,"8.01":1,"8.03":1,"8.50":1,"8.52":1};
var F900={"9.00":1,"9.03":1,"9.04":1,"9.50":1,"9.51":1,"9.60":1};
var FCSS={"10.00":1,"10.01":1,"10.50":1,"10.70":1,"10.71":1,"11.00":1,"11.02":1};
var FSLOP={"11.50":1,"11.52":1,"12.00":1,"12.02":1,"12.50":1,"12.52":1,"13.00":1,"13.02":1,"13.04":1,"13.50":1,"13.52":1};

var A700=["700/alert.js",["700/alert.js","700/config.js","700/lapse.js","700/psfree.js","700/module/chain.js","700/module/int64.js","700/module/mem.js","700/module/memtools.js","700/module/offset.js","700/module/rw.js","700/module/utils.js","700/module/view.js","700/rop/700.js","700/rop/750.js","700/rop/800.js","700/rop/850.js","700/kpatch/700.elf","700/kpatch/750.elf","700/kpatch/800.elf","700/kpatch/850.elf","goldhen_2.4b18.12.bin"],1];
var A900=["900/alert.js",["900/alert.js","900/config.js","900/lapse.js","900/psfree.js","900/module/chain.js","900/module/constants.js","900/module/int64.js","900/module/mem.js","900/module/memtools.js","900/module/offset.js","900/module/rw.js","900/module/utils.js","900/module/view.js","900/rop/900.js","900/rop/950.js","900/kpatch/900.elf","900/kpatch/903.elf","900/kpatch/950.elf","goldhen_2.4b18.12.bin"],1];
var ACSS=["css/main.js",["css/main.js","css/lapse.js","css/loader.js","css/misc.js","css/ps4/constants.js","css/ps4/kernel.js","css/ps4/userland.js","css/worker.js","css/workers.js","css/ps4/patches/1000.bin","css/ps4/patches/1050.bin","css/ps4/patches/1100.bin","css/ps4/patches/1102.bin","goldhen_2.4b18.12.bin"],0];

function slop(v){
  var p=v==="13.04"?"patches/1302.bin":"patches/"+v.replace(".","")+".bin";
  return ["jb.js",["jb.js","core.js","mem.js","int64.js","rpc_worker.js","ps4_offsets.js","goldhen_2.4b18.12.bin",p],1];
}
function route(v){
  if(F700[v])return ["700"].concat(A700);
  if(F900[v])return ["900"].concat(A900);
  if(FCSS[v])return ["CSS"].concat(ACSS);
  if(FSLOP[v])return ["SLOPKIT"].concat(slop(v));
  return null;
}
function detectFirmware(){
  var sources=[
    {name:"USER_AGENT",value:navigator.userAgent||""},
    {name:"APP_VERSION",value:navigator.appVersion||""}
  ];
  var versions={},signals=[],i,m,v;

  for(i=0;i<sources.length;i++){
    m=/PlayStation\s*4(?:[/ ]+|%2F)(\d+)\.(\d+)/i.exec(sources[i].value);
    if(m){
      v=m[1]+"."+m[2];
      versions[v]=(versions[v]||0)+1;
      signals.push(sources[i].name+"="+v);
    }
  }

  var platform=String(navigator.platform||"");
  var isPS4=/PlayStation\s*4/i.test(platform)||/PlayStation\s*4/i.test(navigator.userAgent||"");
  if(platform)signals.push("PLATFORM="+platform);

  var keys=Object.keys(versions);
  if(keys.length>1){
    return {fw:null,confidence:"CONFLICT",signals:signals,reason:"firmware signals disagree"};
  }
  if(!keys.length){
    return {fw:null,confidence:isPS4?"LOW":"NONE",signals:signals,reason:isPS4?"PS4 detected but firmware string missing":"PS4 platform not detected"};
  }

  v=keys[0];
  return {
    fw:v,
    confidence:versions[v]>=2?"HIGH":"MEDIUM",
    signals:signals,
    reason:"firmware confirmed by "+versions[v]+" browser signal"+(versions[v]===1?"":"s")
  };
}
function head(path){
  return fetch(path,{method:"GET",cache:"no-cache",credentials:"same-origin"})
    .then(function(r){return r.ok;})
    .catch(function(){return false;});
}

async function scan(){
  var d=detectFirmware(), fw=d.fw, row=route(fw);
  if(d.signals.length)terminalWrite(d.signals.join(" | "),"DETECT");
  terminalWrite("confidence: "+d.confidence+" // "+d.reason,"DETECT");
  fwEl.textContent=fw||"UNKNOWN";
  fwEl.className="v "+(row?"ok":"warn");

  if(d.confidence==="CONFLICT"){
    engEl.textContent="CONFLICT";
    engEl.className="v bad";
    pre.textContent="BLOCKED";
    pre.className="v bad";
    terminalWrite("firmware detection conflict; refusing to guess","DETECT");
    launch.disabled=true;
    window.h4=null;
    return;
  }

  if(!fw){
    engEl.textContent="UNDETECTED";
    engEl.className="v bad";
    pre.textContent="BLOCKED";
    pre.className="v bad";
    terminalWrite("firmware: "+(fw||"unknown"),"SCAN");
    terminalWrite("no verified firmware route","SCAN");
    launch.disabled=true;
    return;
  }

  engEl.textContent=row[0];
  engEl.className="v ok";
  pre.textContent="CHECKING";
  pre.className="v warn";
  terminalWrite("firmware: "+fw,"SCAN");
  terminalWrite("engine: "+row[0],"SCAN");
  terminalWrite("checking local assets...","SCAN");

  var req=row[2],res=await Promise.all(req.map(head)),bad=[],i;
  terminalWrite("asset verification: "+req.length+" files","VERIFY");
  for(i=0;i<res.length;i++)if(!res[i])bad.push(req[i]);

  if(bad.length){
    pre.textContent="INCOMPLETE";
    pre.className="v bad";
    terminalWrite("missing: "+bad.slice(0,5).join(", ")+(bad.length>5?" ...":""),"SCAN");
    terminalWrite("route blocked: local asset verification failed","VERIFY");
    launch.disabled=true;
    return;
  }

  pre.textContent="READY";
  pre.className="v ok";
  terminalWrite("all required local assets found","VERIFY");
  terminalWrite("firmware + engine + assets verified","VERIFY");
  terminalWrite("route ready","SCAN");
  launch.disabled=false;
  window.h4={fw:fw,row:row};
}

launch.onclick=function(){
  var h=window.h4;
  if(!h||launch.disabled)return;
  launch.disabled=true;
  terminalWrite("initializing "+h.row[1],"LAUNCH");
  var s=document.createElement("script");
  s.type=h.row[3]?"module":"text/javascript";
  s.src=h.row[1];
  s.onerror=function(){
    terminalWrite("engine load failed","LAUNCH");
    launch.disabled=false;
    window.h4=null;
  };
  document.body.appendChild(s);
};

var fwEl=document.getElementById("fw"),engEl=document.getElementById("engine"),pre=document.getElementById("pre"),term=document.getElementById("term"),launch=document.getElementById("launch");
var terminalLines=[];
var terminalMax=180;

function terminalWrite(message,source){
  var text=String(message==null?"":message).replace(/\r/g,"");
  text.split("\n").forEach(function(line){
    if(!line)return;
    var stamp=new Date().toTimeString().slice(0,8);
    terminalLines.push("["+stamp+"] "+(source?"["+source+"] ":"")+line);
  });
  if(terminalLines.length>terminalMax)terminalLines=terminalLines.slice(-terminalMax);
  term.textContent=terminalLines.join("\n");
  term.scrollTop=term.scrollHeight;
}

window.H4SENSI_LOG=function(message,source){
  terminalWrite(message,source||"ENGINE");
};

window.addEventListener("h4sensi-log",function(event){
  var detail=event.detail||{};
  terminalWrite(detail.message==null?detail.value:detail.message,detail.source||"ENGINE");
});

terminalWrite("terminal online","BOOT");

document.getElementById("scan").onclick=scan;
scan();
})();
</script>
</body>
</html>
