<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>H4SENSI | GoldHEN</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0a0a;color:#fff;font-family:Inter,Arial,sans-serif}
main{width:min(420px,88vw);text-align:center;padding:42px 28px;border:1px solid #222;border-radius:20px;background:#101010}
.author{margin:0 0 10px;font-size:14px;letter-spacing:4px;color:#8f8f8f;font-weight:700}
h1{margin:0;font-size:34px;letter-spacing:-1px}
.version{margin:9px 0 28px;color:#777;font-size:14px}
button{width:100%;padding:14px 20px;border:0;border-radius:10px;background:#fff;color:#000;font-size:15px;font-weight:700;cursor:pointer}
button:active{transform:scale(.98)}
#status{margin:16px 0 0;color:#666;font-size:12px}
</style>
</head>
<body>
<main>
  <div class="author">H4SENSI</div>
  <h1>GoldHEN</h1>
  <div class="version">PS4 · Firmware 13.52</div>
  <button id="go">CARGAR GOLDHEN</button>
  <div id="status">Listo para cargar.</div>
</main>
<script>
const host="https://psx8.github.io/1352/index.html";
document.getElementById("go").addEventListener("click",()=>{
  document.getElementById("status").textContent="Cargando GoldHEN...";
  window.location.href=host;
});
</script>
</body>
</html>
