<html lang="en">

<style>
:root{color-scheme:dark;--bg:#030608;--panel:#081017;--line:#17303b;--text:#e8fff1;--muted:#71828c;--dim:#3b4b54;--green:#5cff9a;--amber:#ffd166;--red:#ff6675}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Courier New",monospace}
body{background-image:linear-gradient(rgba(92,255,154,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(92,255,154,.03) 1px,transparent 1px);background-size:28px 28px}
main{width:min(940px,94vw);margin:auto;padding:24px 0}.bar{display:flex;justify-content:space-between;border:1px solid var(--line);padding:12px 14px}.brand{font-weight:800;letter-spacing:.23em}.live{color:var(--green);font-size:11px;letter-spacing:.14em}
h1{font-size:clamp(34px,8vw,70px);line-height:.9;font-weight:400;letter-spacing:-.07em;margin:34px 0 8px}.sub{color:var(--muted);font:14px/1.5 Arial,Helvetica,sans-serif}
.panel{margin-top:22px;border:1px solid var(--line);background:#060c10}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line)}.cell{padding:14px;background:#071015}.label{display:block;color:var(--dim);font-size:10px;letter-spacing:.13em;margin-bottom:6px}.v{font-size:13px;font-weight:700}.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
.term{min-height:155px;padding:15px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:#8ca198;font-size:12px;line-height:1.55;white-space:pre-wrap;overflow:auto}
.controls{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:15px}select,.btn{border:1px solid var(--line);background:#0a1218;color:var(--text);padding:13px 12px;font:700 12px "Courier New",monospace}.btn{cursor:pointer}.btn.primary{background:var(--green);color:#001108;border-color:var(--green)}.btn:disabled{opacity:.4;cursor:default}
.foot{display:flex;justify-content:space-between;color:var(--dim);font-size:10px;letter-spacing:.08em;padding-top:10px}
@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr}.foot{flex-direction:column;gap:6px}}
</style>
</head>

</select>
<button class="btn" id="scan">RESCAN</button>
<button class="btn primary" id="launch">ROUTE</button>
</div>
</section>
<div class="foot"><span>H4SENSI // MULTI-FW ROUTER</span><span>NO RUNTIME THIRD-PARTY REDIRECT</span></div>
</main>
