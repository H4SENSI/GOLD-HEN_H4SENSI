<!doctype html>
<html lang="es" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>H4SENSI | GoldHEN 13.52</title>
<style>
:root{color-scheme:dark;--bg:#07080b;--panel:#0d1016;--panel2:#11151d;--line:#202733;--text:#f4f6f8;--muted:#8b95a5}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:18px}
button{font:inherit}
.shell{width:min(560px,94vw)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.brand{color:var(--text);font-weight:800}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:#7cffb2;box-shadow:0 0 14px rgba(124,255,178,.45)}
h1{margin:20px 0 5px;font-size:clamp(42px,10vw,72px);line-height:.95;letter-spacing:-.055em}
.version{color:var(--muted);font-size:15px;margin-bottom:26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.info{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:#0a0d12}
.label{display:block;color:#677180;font-size:10px;text-transform:uppercase;letter-spacing:.15em;margin-bottom:5px}
.value{font-weight:700;font-size:14px}
.launch{width:100%;border:0;border-radius:14px;padding:17px 18px;background:#fff;color:#000;font-weight:800;font-size:16px;cursor:pointer}
.launch:focus,.launch:hover{outline:2px solid #fff;outline-offset:3px}
.launch:active{transform:scale(.99)}
.status{min-height:18px;margin-top:14px;text-align:center;color:var(--muted);font-size:12px}
.foot{text-align:center;margin-top:12px;color:#56606e;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
@media(max-width:520px){.card{padding:22px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
  <div class="top"><span class="brand">H4SENSI</span><span>LOCAL HOST</span></div>
  <section class="card">
    <span class="badge"><span class="dot"></span> Host preparado</span>
    <h1>GoldHEN</h1>
    <div class="version">PS4 Firmware 13.52</div>
    <div class="grid">
      <div class="info"><span class="label">Firmware</span><span class="value">13.52</span></div>
      <div class="info"><span class="label">Host</span><span class="value">H4SENSI</span></div>
      <div class="info"><span class="label">Carga</span><span class="value">Local</span></div>
      <div class="info"><span class="label">Modo</span><span class="value">GoldHEN</span></div>
    </div>
    <button class="launch" id="launch">CARGAR GOLDHEN</button>
    <div class="status" id="status">Listo.</div>
  </section>
  <div class="foot">H4SENSI · PS4 13.02–13.52</div>
</main>
<script>
(function(){
  var b=document.getElementById("launch"),s=document.getElementById("status");
  b.onclick=function(){
    b.disabled=true;
    b.textContent="INICIANDO...";
    s.textContent="Abriendo el motor local...";
    location.href="jb.html";
  };
})();
</script>
</body>
</html>
